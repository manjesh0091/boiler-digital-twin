# -----------------------------------------------------------------------------
# gas.* (models.GasMeasurements)
# -----------------------------------------------------------------------------
gas:
  o2_economizer_outlet_dry_pct:
    status: needs_verification
    candidate_raw_tags: ["O2 LHS", "O2 RHS"]
    note: >
      Module 1's only real O2 tag (FLUE_GAS_O2_APH_INLET, average of O2
      LHS/RHS) is physically at the air-heater flue-gas INLET. In this
      plant's single-economizer-stage gas path (furnace -> ECO-1 -> air
      heater -> ESP -> stack) that is the same position as "economizer
      outlet" -- mapped here as a DOCUMENTED assumption (see this field's
      data_source note in the API response), not silently reused for both
      O2 fields below.
  o2_air_heater_outlet_dry_pct:
    status: synthetic_needed
    note: >
      No second O2 sensor exists downstream of the air heater anywhere in
      the historian export. air_heater_leakage_pct (and everything
      downstream of it: dry/wet flue-gas rates, dry-gas-loss term) is
      therefore placeholder-driven until a real AH-outlet O2 tag is
      confirmed or installed. Do NOT reuse o2_economizer_outlet_dry_pct's
      value here -- that would force computed leakage to exactly 0, a
      fabricated-looking-real number, not an honest "unknown."
  gas_temp_air_heater_inlet_c:
    status: needs_verification
    candidate_raw_tags: []
    note: >
      No tag explicitly named "air heater" exists. Closest candidates in the
      raw export are economizer/ESP-path tags (FG TEMP ECO-1 I/L, FG TEMP AT
      ECO-1 O/L, FG TEMP BEFORE ESP, FG TEMP AFTER ESP) -- none confirmed as
      the air-heater-specific point. Same naming-mismatch pattern this
      project already hit with Furnace Draft/Drum Level; needs plant
      confirmation before mapping any of them here.
  gas_temp_air_heater_outlet_c:
    status: needs_verification
    note: "Same situation as gas_temp_air_heater_inlet_c -- no confirmed tag."
  air_temp_air_heater_inlet_c:
    status: needs_verification
    candidate_raw_tags: ["AIR TEMP AT AIR BOX A", "AIR TEMP AT AIR BOX B"]
    note: >
      Air-box tags exist but read, physically, as POST-air-heater (hot
      secondary air delivered to the windbox) -- i.e. closer to the air
      heater's air-side OUTLET than its INLET, the opposite point this
      field name asks for. Flagged as a candidate, not mapped, pending
      plant confirmation of the actual tap location.
  air_temp_fan_inlet_c:
    status: synthetic_needed
    note: "Optional in the dataclass -- orchestrator falls back to ambient.dry_bulb_c when None, itself synthetic_needed, so this doesn't add a new blocker."
  flue_gas_specific_heat_cpg_btu_lbm_f:
    status: static_config
    note: "Not a live tag -- a near-constant physical-property assumption, not sensor-derived. Library's own Appendix D-4 example uses 0.264; reused as the placeholder pending Awes's plant-specific recommendation."
    value: 0.264

