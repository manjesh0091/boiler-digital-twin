# =============================================================================
# PAI-S02 — Boiler Efficiency Monitoring
# Tag Mapping Config — Plant: Hindalco Boiler-9 (CFBC, Unit 4)
# Rev 1 — initial integration of the ASME PTC-4-style indirect/heat-loss
# efficiency calculation library (backend/efficiency_engine/boiler_efficiency/),
# tiered against the real historian export (data/raw/boiler9_cleaned_2024.csv,
# 103 raw columns) plus Module 1 (hindalco_boiler9_pai_s01_v2.yaml) and
# Module 2's (hindalco_boiler9_pai_s03_v1.yaml) existing tag mappings.
#
# Status vocabulary matches PAI-S01/PAI-S03: available / derived /
# needs_verification / synthetic_needed / static_config.
# =============================================================================

plant_id: hindalco_boiler9
boiler_type: CFBC
timestamp_column: "Timestamp"

# -----------------------------------------------------------------------------
# Raw tag(s) this file adds to the extraction pipeline, via the same
# shared/feature_extraction.build_feature_view() Module 1/Cluster 1/Module 2
# already use. Everything else boiler_duty.* needs below already exists as a
# column in module1_features.csv and is read directly off Module 1's own
# replayed row -- only FW_PR_TO_FCS is new (confirmed present in the raw
# historian export under this exact name; not yet extracted for any module).
#
# SH3_PRESSURE_A/B, SH3_TEMP_A/B, O2_LHS/RHS added 2026-08-13 for Logical
# Filtering & Validation Rule #6 (redundant A/B instrument deviation check,
# |A-B|/avg <=5% before averaging) -- these are the SAME raw tags Module 1
# already averages into MAIN_STEAM_PRESSURE/MAIN_STEAM_TEMPERATURE/
# FLUE_GAS_O2_APH_INLET, kept separate here purely for this validation
# check (the efficiency calc itself still uses Module 1's real averages,
# unchanged). Steam Flow A/B not duplicated here -- already available
# separately via Cluster 1's own feature view (self._cluster_view).
# -----------------------------------------------------------------------------
parameters:
  FW_PR_TO_FCS:
    status: available
    raw_tags: ["FW PR TO FCS"]
    aggregation: single
    unit: "kg/cm2"
  SH3_PRESSURE_A: {status: available, raw_tags: ["SH-3 O/L STM PR-A"], aggregation: single, unit: "kg/cm2"}
  SH3_PRESSURE_B: {status: available, raw_tags: ["SH-3 O/L STM PR-B"], aggregation: single, unit: "kg/cm2"}
  SH3_TEMP_A: {status: available, raw_tags: ["SH-3 O/L STM TEMP-A"], aggregation: single, unit: degC}
  SH3_TEMP_B: {status: available, raw_tags: ["SH-3 O/L STM TEMP-B"], aggregation: single, unit: degC}
  O2_LHS: {status: available, raw_tags: ["O2 LHS"], aggregation: single, unit: "% vol"}
  O2_RHS: {status: available, raw_tags: ["O2 RHS"], aggregation: single, unit: "% vol"}

# -----------------------------------------------------------------------------
# boiler_duty.* (models.BoilerDutyInputs) -- all six fields real. Five are
# already extracted by Module 1 into module1_features.csv; the sixth
# (FW_PR_TO_FCS) is the new tag added just above. No unit conversion needed
# anywhere here -- the library's expected units (TPH, kg/cm2 abs, degC) match
# Module 1's existing extraction exactly.
# -----------------------------------------------------------------------------
boiler_duty:
  MAIN_STEAM_FLOW: {status: available, source: "module1_features.csv (PAI-S01 config)", unit: TPH}
  MAIN_STEAM_PRESSURE: {status: available, source: "module1_features.csv", unit: "kg/cm2 (a)"}
  MAIN_STEAM_TEMPERATURE: {status: available, source: "module1_features.csv", unit: degC}
  FEEDWATER_FLOW: {status: available, source: "module1_features.csv", unit: TPH}
  FEEDWATER_TEMP_TO_FCS: {status: available, source: "module1_features.csv", unit: degC}
  FW_PR_TO_FCS: {status: available, source: "this file's own `parameters` block above", unit: "kg/cm2 (a)"}

# -----------------------------------------------------------------------------
# fuel.* (models.FuelAnalysis)
#
# CORRECTION to the original integration brief: the brief assumed
# oxygen_pct/nitrogen_pct/sulfur_pct were already static config values from
# Module 1, named COAL_O_LAB/COAL_N_LAB/COAL_S_LAB. That is NOT the case --
# grepped the full repo (config/*.yaml, engine/*.py, shared/*.py,
# clusters/*) and no such keys, nor any numeric O%/N%/S%/ash%/moisture%
# value for this plant's coal, exist anywhere. The only real fuel constant
# in this codebase is GCV. state_builder.py's own docstring asserts "O%, N%,
# S% are [available]" but that claim isn't backed by an actual config entry
# either -- likely a plan for a value that was never actually wired in.
#
# RESOLVED 2026-08-13 (ask-list item #14) -- real Ultimate + Proximate
# Analysis received from a plant engineering document (fuel
# ultimate/proximate analysis test report). Same lab report unblocks
# Module 2's afr_design too (see decisions.md #18/#43) -- not asked twice.
# Ultimate-analysis closure (C+H+O+N+S+ash+moisture) = 100.01%, passes the
# library's own validate_fuel() check (tolerance 1.0%, warns past 0.1% --
# this is well inside both). VM+FC+ash+moisture sums to 106.0%, not 100%
# (proximate analyses are commonly reported on a different moisture basis
# than the ultimate analysis in real lab reports; the library doesn't
# validate this pair at all, so this isn't a blocking concern) -- noted for
# transparency, not treated as an error.
#
# hhv_kj_kg NOTE: this document's value (14870 kJ/kg = 3552.0 kcal/kg)
# differs from Module 1's COAL_GCV static constant (3610 kcal/kg, ~1.6%
# higher, unknown source document/date) by more than rounding. Using THIS
# document's value here since it's explicitly named in this ask; Module 1's
# COAL_GCV and adapter.py's separate GCV_KCAL_PER_KG constant (used for
# eta_direct's independent Q_input in Gate 1's mass-balance cross-check)
# are NOT changed by this update -- deliberately, so Gate 1 keeps an
# independent GCV source rather than both sides silently converging on one
# document. Reconciling which GCV figure is authoritative is a new,
# separate ask -- see consolidated_ask_list.md.
# -----------------------------------------------------------------------------
fuel:
  hhv_kj_kg:
    status: static_config
    source: "plant engineering document (fuel ultimate/proximate analysis report), 2026-08-13"
    last_updated: "2026-08-13"
    value_kj_kg: 14870
  carbon_pct: {status: static_config, source: "plant engineering document, 2026-08-13", last_updated: "2026-08-13", value: 36.13}
  hydrogen_pct: {status: static_config, source: "plant engineering document, 2026-08-13", last_updated: "2026-08-13", value: 2.05}
  oxygen_pct: {status: static_config, source: "plant engineering document, 2026-08-13", last_updated: "2026-08-13", value: 11.32}
  nitrogen_pct: {status: static_config, source: "plant engineering document, 2026-08-13", last_updated: "2026-08-13", value: 0.89}
  sulfur_pct: {status: static_config, source: "plant engineering document, 2026-08-13", last_updated: "2026-08-13", value: 0.5}
  ash_pct: {status: static_config, source: "plant engineering document, 2026-08-13", last_updated: "2026-08-13", value: 36.81}
  moisture_pct: {status: static_config, source: "plant engineering document, 2026-08-13", last_updated: "2026-08-13", value: 12.31}
  volatile_matter_pct: {status: static_config, source: "plant engineering document, 2026-08-13", last_updated: "2026-08-13", value: 26.4}
  fixed_carbon_pct: {status: static_config, source: "plant engineering document, 2026-08-13", last_updated: "2026-08-13", value: 30.48}

